name: Sürüm

# Elle tetiklenir ("surum" girişi, ör. 0.2.0 ya da v0.2.0): imzalı Android APK + AAB üretip
# GitHub Sürümüne (etiket v<surum>, çalışılan commit üzerinde) yükler. AAB ayrıca Play Console'a
# yüklenmek üzere ayrı artefakt olarak da verilir (officehere-android-aab-<surum>).
# "github_surumu" kapalıysa paketler yalnız artefakt olarak verilir; etiket ve GitHub Sürümü açılmaz
# (Play kapalı test derlemesi: her yüklemede sürüm, dolayısıyla versionCode, büyümeli).
# "surum: deneme": package.json sürümüyle yalnız artefakt (derleme denemesi; Play'e yüklenemez,
# versionCode yayımlanmış sürümle aynı).
#
# İmza anahtarı depo gizli değerlerinden okunur:
#   ANDROID_KEYSTORE_BASE64   keystore dosyasının base64 hali (base64 -w0 officehere.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore parolası
#   ANDROID_KEY_ALIAS         anahtar adı
#   ANDROID_KEY_PASSWORD      anahtar parolası
# Anahtar üretmek için:
#   keytool -genkeypair -v -keystore officehere.jks -alias officehere -keyalg RSA -keysize 4096 -validity 10000
# Gizli değerler yoksa paketler İMZASIZ üretilir (dosya adında "-imzasiz") ve sürüm taslak olarak açılır.
on:
  workflow_dispatch:
    inputs:
      surum:
        description: "Sürüm (ör. 0.2.0 ya da v0.2.0); yalnız derleme denemesi için: deneme"
        required: true
        type: string
      github_surumu:
        description: "GitHub Sürümü aç (kapalıysa paketler yalnız artefakt: ör. Play kapalı test derlemesi)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: surum-${{ inputs.surum }}
  cancel-in-progress: false

jobs:
  android:
    name: Android paketi (APK + AAB) ve GitHub Sürümü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - id: surum
        name: Sürümü çözümle
        shell: bash
        env:
          GIRDI: ${{ inputs.surum }}
          YAYIN: ${{ inputs.github_surumu }}
        run: |
          yayinla=true
          if [ "$YAYIN" = "false" ]; then yayinla=false; fi
          s="${GIRDI#v}"
          if [ "$GIRDI" = "deneme" ]; then
            # Deneme: sürüm package.json'dan, yayın yok.
            yayinla=false
            s=$(node -p "require('./package.json').version")
          fi
          if ! [[ "$s" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error title=Geçersiz sürüm::'$GIRDI' MAJOR.MINOR.PATCH biçiminde olmalı (ör. 0.2.0) ya da 'deneme'."
            exit 1
          fi
          # versionCode sürümle birlikte artar: 0.2.0 → 2000, 1.4.12 → 1004012.
          kod=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          ad="$s"
          if [ "$GIRDI" = "deneme" ]; then ad="$s-deneme-${GITHUB_SHA::7}"; fi
          {
            echo "surum=$s"
            echo "etiket=v$s"
            echo "kod=$kod"
            echo "ad=$ad"
            echo "yayinla=$yayinla"
          } >> "$GITHUB_OUTPUT"
          echo "Sürüm $s (versionCode $kod), yayın: $yayinla"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Sürümü package.json ve Android'e işle
        env:
          SURUM: ${{ steps.surum.outputs.surum }}
          KOD: ${{ steps.surum.outputs.kod }}
        run: |
          npm pkg set version="$SURUM"
          sed -i -E "s/^([[:space:]]*versionCode = )[0-9]+/\1$KOD/; s/^([[:space:]]*versionName = )\"[^\"]*\"/\1\"$SURUM\"/" android/app/build.gradle
          grep -q "versionCode = $KOD" android/app/build.gradle
          grep -q "versionName = \"$SURUM\"" android/app/build.gradle

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm exec cap sync android

      - id: imza
        name: İmza anahtarı
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning title=İmza anahtarı yok::ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS ve ANDROID_KEY_PASSWORD gizli değerlerinin hepsi tanımlı değil. Paketler İMZASIZ üretilecek: cihaza kurulamaz ve Play Console'a yüklenemez; sürüm taslak olarak açılır."
            echo "imzali=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/officehere.jks" 2>/dev/null || [ ! -s "$RUNNER_TEMP/officehere.jks" ]; then
            echo "::error title=Geçersiz anahtar::ANDROID_KEYSTORE_BASE64 çözülemedi (base64 -w0 officehere.jks çıktısı olmalı)."
            exit 1
          fi
          echo "OH_KEYSTORE_FILE=$RUNNER_TEMP/officehere.jks" >> "$GITHUB_ENV"
          echo "imzali=true" >> "$GITHUB_OUTPUT"

      - name: Derle (assembleRelease + bundleRelease)
        working-directory: android
        env:
          OH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      # Anahtar dosyası yalnız derleme süresince diskte kalır (derleme başarısız olsa da silinir).
      - name: İmza anahtarını sil
        if: always()
        run: rm -f "$RUNNER_TEMP/officehere.jks"

      - name: Paketleri adlandır ve doğrula
        env:
          AD: ${{ steps.surum.outputs.ad }}
          KOD: ${{ steps.surum.outputs.kod }}
          IMZALI: ${{ steps.imza.outputs.imzali }}
        run: |
          mkdir -p paketler
          out=android/app/build/outputs
          bt="$ANDROID_HOME/build-tools/36.0.0"
          aab="$out/bundle/release/app-release.aab"
          if [ "$IMZALI" = "true" ]; then
            ek=""
            apk="$out/apk/release/app-release.apk"
            apk_sha=$("$bt/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            # AAB de aynı (yükleme) anahtarıyla imzalı olmalı (öz imzalı sertifika olağan: -strict kullanılmaz).
            if ! jarsigner -verify "$aab" | grep -q "jar verified"; then
              echo "::error title=AAB imzasız::app-release.aab imzalı değil."
              exit 1
            fi
            aab_sha=$(keytool -printcert -jarfile "$aab" | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
            if [ -z "$apk_sha" ] || [ "$apk_sha" != "$aab_sha" ]; then
              echo "::error title=İmza uyuşmuyor::APK ($apk_sha) ve AAB ($aab_sha) farklı anahtarla imzalı."
              exit 1
            fi
            # Play Console ve Android geliştirici doğrulaması kaydında sorulan parmak izi.
            echo "İmza sertifikası SHA-256: $apk_sha" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            ek="-imzasiz"
            apk="$out/apk/release/app-release-unsigned.apk"
          fi
          # Gizlilik beyanı: uygulama hiçbir Android izni (INTERNET dahil) istemez. androidx'in kendi
          # imzalı alıcı izni (<paket>.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION) dışında izin varsa dur.
          izinler=$("$bt/aapt2" dump permissions "$apk")
          echo "$izinler"
          if echo "$izinler" | grep -E "uses-permission" | grep -v "com.officehere.mobile.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" | grep -q .; then
            echo "::error title=Beklenmeyen izin::Pakette Android izni var (gizlilik beyanı: izin yok). AndroidManifest ve eklentileri denetleyin."
            exit 1
          fi
          if ! "$bt/aapt2" dump badging "$apk" | grep -q "versionCode='$KOD'"; then
            echo "::error title=versionCode::Paketin versionCode değeri $KOD değil."
            exit 1
          fi
          cp "$apk" "paketler/OfficeHere-${AD}-android${ek}.apk"
          cp "$aab" "paketler/OfficeHere-${AD}-android${ek}.aab"
          (cd paketler && sha256sum OfficeHere-* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: officehere-android-${{ steps.surum.outputs.ad }}
          path: paketler/*
          if-no-files-found: error

      # Play Console'a (kapalı test / üretim) yüklenecek paket tek başına.
      - uses: actions/upload-artifact@v7
        with:
          name: officehere-android-aab-${{ steps.surum.outputs.ad }}
          path: paketler/*.aab
          if-no-files-found: error

      # Sürüm notları docs/surumler/<etiket>.md dosyasından; yoksa GitHub otomatik üretir.
      - id: notlar
        if: steps.surum.outputs.yayinla == 'true'
        env:
          ETIKET: ${{ steps.surum.outputs.etiket }}
        run: |
          if [ -f "docs/surumler/${ETIKET}.md" ]; then echo "yol=docs/surumler/${ETIKET}.md" >> "$GITHUB_OUTPUT"; fi

      - uses: softprops/action-gh-release@v3
        if: steps.surum.outputs.yayinla == 'true'
        with:
          tag_name: ${{ steps.surum.outputs.etiket }}
          target_commitish: ${{ github.sha }}
          name: OfficeHere Mobil ${{ steps.surum.outputs.etiket }}
          files: paketler/*
          body_path: ${{ steps.notlar.outputs.yol }}
          generate_release_notes: ${{ steps.notlar.outputs.yol == '' }}
          draft: ${{ steps.imza.outputs.imzali != 'true' }}
          fail_on_unmatched_files: true
